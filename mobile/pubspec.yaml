name: roadmate_india
description: Safety-first motorcycle touring app for Indian riders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Navigation  
  go_router: ^13.1.0
  # HTTP
  dio: ^5.4.0
  # Local DB
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  # Storage
  flutter_secure_storage: ^9.0.0
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  # Sensors
  sensors_plus: ^4.0.2
  # Location
  geolocator: ^10.1.0
  # Image picker
  image_picker: ^1.0.5
  # JSON
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
